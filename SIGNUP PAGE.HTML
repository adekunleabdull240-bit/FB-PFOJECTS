<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Facebook</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #fff;
    color: #1c1e21;
  }


 
 
 

 
  .page {
    max-width: 850px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  .back-arrow {
    display: inline-block;
    font-size: 22px;
    text-decoration: none;
    color: #1c1e21;
    margin-bottom: 20px;
  }

  .meta-logo {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 30px;
  }

  .meta-logo svg {
    width: 24px;
    height: 24px;
    fill: #0866ff;
  }

  .meta-logo span {
    font-size: 20px;
    font-weight: bold;
  }

  h1 {
    font-size: 34px;
    margin-bottom: 14px;
  }

  .intro {
    font-size: 16px;
    color: #333;
    margin-bottom: 36px;
    max-width: 650px;
  }

  .field-label {
    font-size: 20px;
    font-weight: bold;
    margin-bottom: 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .help-icon {
    width: 18px;
    height: 18px;
    border-radius: 50%;
    border: 1px solid #888;
    color: #888;
    font-size: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .field-row {
    display: flex;
    gap: 20px;
    margin-bottom: 30px;
  }

  .field-row.wrap {
    flex-wrap: wrap;
  }

  input[type="text"],
  input[type="password"],
  select {
    width: 100%;
    padding: 16px 44px 16px 16px;
    border: 1px solid #d5d8dc;
    border-radius: 12px;
    font-size: 17px;
    color: #1c1e21;
    background: white;
    box-shadow: 0 1px 2px rgba(0, 0, 0, 0.04);
    appearance: none;
  }

  input[type="text"],
  input[type="password"] {
    padding: 18px 16px;
  }

  input[type="text"]::placeholder,
  input[type="password"]::placeholder {
    color: #65676b;
  }

  input[type="text"]:focus,
  input[type="password"]:focus,
  select:focus {
    outline: none;
    border-color: #0866ff;
    box-shadow: 0 0 0 2px rgba(8, 102, 255, 0.15);
  }

  select {
    cursor: pointer;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'><path fill='%23444' d='M7 10l5 5 5-5z'/></svg>");
    background-position: calc(100% - 14px) center;
    background-size: 20px 20px;
    background-repeat: no-repeat;
  }

  .field {
    flex: 1;
  }

  .notice {
    font-size: 14px;
    color: #444;
    margin-bottom: 30px;
    line-height: 1.5;
  }

  .notice a,
  .legal a {
    color: #0866ff;
    text-decoration: none;
    font-weight: bold;
  }

  .notice a:hover,
  .legal a:hover {
    text-decoration: underline;
  }

  .legal {
    font-size: 13px;
    color: #444;
    line-height: 1.6;
    margin-bottom: 20px;
  }

  .legal p {
    margin-bottom: 14px;
  }

  .submit-btn {
    display: block;
    width: 100%;
    padding: 16px;
    background: #0866ff;
    color: white;
    border: none;
    border-radius: 999px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    margin-bottom: 14px;
  }

  .submit-btn:hover {
    background: #0653d3;
  }

  .login-instead-btn {
    display: block;
    width: 100%;
    padding: 16px;
    box-sizing: border-box;
    background: #f0f2f5;
    color: #1c1e21;
    text-align: center;
    text-decoration: none;
    border: none;
    border-radius: 999px;
    font-size: 16px;
    font-weight: bold;
    cursor: pointer;
  }

  .login-instead-btn:hover {
    background: #e4e6e9;
  }

  
  @media screen and (max-width: 700px) {
    .page {
      padding: 30px 20px 60px;
    }

    h1 {
      font-size: 26px;
    }

    .field-row {
      flex-direction: column;
      gap: 14px;
    }
  }

  @media screen and (max-width: 420px) {
    .titlebar span {
      font-size: 12px;
    }

    h1 {
      font-size: 22px;
    }

    .intro {
      font-size: 14px;
    }

    .field-label {
      font-size: 17px;
    }
  }
</style>
</head>
<body>

 

  <div class="page">

    <a href="LOGIN PAGE.HTML" class="back-arrow">&#8592;</a>

    <div class="meta-logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M640 381.9C640 473.2 600.6 530.4 529.7 530.4C467.1 530.4 433.9 495.8 372.8 393.8L341.4 341.2C333.1 328.7 326.9 317 320.2 306.2C300.1 340 273.1 389.2 273.1 389.2C206.1 505.8 168.5 530.4 116.2 530.4C43.4 530.4 0 473.1 0 384.5C0 241.5 79.8 106.4 183.9 106.4C234.1 106.4 277.7 131.1 328.7 195.9C365.8 145.8 406.8 106.4 459.3 106.4C558.4 106.4 640 232.1 640 381.9zM287.4 256.2C244.5 194.1 216.5 175.7 183 175.7C121.1 175.7 69.2 281.8 69.2 385.7C69.2 434.2 87.7 461.4 118.8 461.4C149 461.4 167.8 442.4 222 357.6C222 357.6 246.7 318.5 287.4 256.2zM531.2 461.4C563.4 461.4 578.1 433.9 578.1 386.5C578.1 262.3 523.8 161.1 454.9 161.1C421.7 161.1 393.8 187 360 239.1C369.4 252.9 379.1 268.1 389.3 284.5L426.8 346.9C485.5 441 500.3 461.4 531.2 461.4z"/></svg>
      <span>Meta</span>
    </div>

    <h1>Get started on Facebook</h1>
    <p class="intro">Create an account to connect with friends, family and communities of people who share your interests.</p>

    <!-- name -->
    <div class="field-label">Name</div>
    <div class="field-row">
      <div class="field">
        <input type="text" placeholder="First name">
      </div>
      <div class="field">
        <input type="text" placeholder="Surname">
      </div>
    </div>

    <!-- date of birth -->
    <div class="field-label">
      Date of birth
      <span class="help-icon">?</span>
    </div>
    <div class="field-row">
      <div class="field">
        <select>
          <option value="">Day</option>
          <option>1</option><option>2</option><option>3</option><option>4</option><option>5</option>
          <option>6</option><option>7</option><option>8</option><option>9</option><option>10</option>
          <option>11</option><option>12</option><option>13</option><option>14</option><option>15</option>
          <option>16</option><option>17</option><option>18</option><option>19</option><option>20</option>
          <option>21</option><option>22</option><option>23</option><option>24</option><option>25</option>
          <option>26</option><option>27</option><option>28</option><option>29</option><option>30</option>
          <option>31</option>
        </select>
      </div>
      <div class="field">
        <select>
          <option value="">Month</option>
          <option>January</option><option>February</option><option>March</option><option>April</option>
          <option>May</option><option>June</option><option>July</option><option>August</option>
          <option>September</option><option>October</option><option>November</option><option>December</option>
        </select>
      </div>
      <div class="field">
        <select>
          <option value="">Year</option>
          <option>2026</option><option>2025</option><option>2024</option><option>2023</option><option>2022</option>
          <option>2021</option><option>2020</option><option>2019</option><option>2018</option><option>2017</option>
          <option>2016</option><option>2015</option><option>2014</option><option>2013</option><option>2012</option>
          <option>2011</option><option>2010</option><option>2009</option><option>2008</option><option>2007</option>
          <option>2006</option><option>2005</option><option>2004</option><option>2003</option><option>2002</option>
          <option>2001</option><option>2000</option><option>1999</option><option>1998</option><option>1997</option>
        </select>
      </div>
    </div>

    <!-- gender -->
    <div class="field-label">
      Gender
      <span class="help-icon">?</span>
    </div>
    <div class="field-row">
      <div class="field">
        <select>
          <option value="">Select your gender</option>
          <option>Female</option>
          <option>Male</option>
          <option>Custom</option>
        </select>
      </div>
    </div>

    <!-- mobile / email -->
    <div class="field-label">Mobile number or email address</div>
    <div class="field-row">
      <div class="field">
        <input type="text" placeholder="Mobile number or email address">
      </div>
    </div>

    <!-- password -->
    <div class="field-label">Password</div>
    <div class="field-row">
      <div class="field">
        <input type="password" placeholder="Password">
      </div>
    </div>

    <button class="submit-btn">Submit</button>
    <a href="facebook-login-embedded.html" class="login-instead-btn">I already have an account</a>

  </div>

</body>
</html>
